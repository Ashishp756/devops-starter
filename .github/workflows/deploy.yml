name: Deploy to AWS EC2

on:
  push:
    branches:
      - main

  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Upload website to EC2
        uses: appleboy/scp-action@v1.0.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          port: ${{ secrets.EC2_SSH_PORT }}
          source: "index.html,assets"
          target: "/tmp/devops-starter"

      - name: Deploy website on EC2
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          port: ${{ secrets.EC2_SSH_PORT }}
          script: |
            sudo mkdir -p /var/www/html

            sudo cp /tmp/devops-starter/index.html /var/www/html/index.html

            sudo rm -rf /var/www/html/assets
            sudo cp -r /tmp/devops-starter/assets /var/www/html/assets

            sudo systemctl restart nginx

            sudo rm -rf /tmp/devops-starter

            echo "Website deployed successfully!"
