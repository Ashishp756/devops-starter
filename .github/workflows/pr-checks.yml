name: PR Checks

# Runs every time someone opens or updates a Pull Request targeting main
on:
  pull_request:
    branches: [ "main" ]

jobs:
  test:
    name: Run sanity tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tests
        run: pytest tests/ -v
